<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>My AI</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, Helvetica, sans-serif;
            background: #f3f6fb;
            color: #182033;
            height: 100vh;
            overflow: hidden;
        }

        .app {
            display: flex;
            height: 100vh;
            width: 100%;
        }

        /* =========================
           SIDEBAR
        ========================== */

        .sidebar {
            width: 260px;
            background: #ffffff;
            border-right: 1px solid #dfe5ef;
            padding: 18px;
            display: flex;
            flex-direction: column;
            transition: transform 0.25s ease;
            z-index: 20;
        }

        .brand {
            font-size: 24px;
            font-weight: 800;
            margin-bottom: 18px;
            color: #2563eb;
        }

        .new-chat {
            border: none;
            background: #2563eb;
            color: white;
            padding: 13px 16px;
            border-radius: 12px;
            font-size: 15px;
            cursor: pointer;
            font-weight: 700;
            margin-bottom: 18px;
        }

        .new-chat:hover {
            background: #1d4ed8;
        }

        .sidebar-title {
            font-size: 12px;
            color: #7b8495;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin: 8px 0;
        }

        .history {
            flex: 1;
            overflow-y: auto;
        }

        .history-item {
            padding: 10px 12px;
            border-radius: 10px;
            margin-bottom: 6px;
            cursor: pointer;
            font-size: 14px;
            color: #3b4352;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .history-item:hover {
            background: #f0f4fa;
        }

        /* =========================
           MAIN
        ========================== */

        .main {
            flex: 1;
            min-width: 0;
            display: flex;
            flex-direction: column;
            background: #f8fafc;
        }

        .topbar {
            height: 64px;
            background: white;
            border-bottom: 1px solid #dfe5ef;
            display: flex;
            align-items: center;
            padding: 0 18px;
            gap: 12px;
        }

        .menu-btn {
            display: none;
            border: none;
            background: transparent;
            font-size: 25px;
            cursor: pointer;
        }

        .top-title {
            font-weight: 800;
            font-size: 18px;
        }

        .status {
            margin-left: auto;
            font-size: 12px;
            color: #16a34a;
            font-weight: 700;
        }

        /* =========================
           CHAT
        ========================== */

        .chat {
            flex: 1;
            overflow-y: auto;
            padding: 28px 18px 150px;
        }

        .chat-inner {
            max-width: 950px;
            margin: 0 auto;
        }

        .welcome {
            text-align: center;
            margin: 90px auto 30px;
            max-width: 700px;
        }

        .welcome h1 {
            font-size: 38px;
            margin-bottom: 10px;
        }

        .welcome p {
            color: #667085;
            line-height: 1.6;
        }

        .message {
            display: flex;
            margin-bottom: 24px;
            gap: 12px;
            align-items: flex-start;
        }

        .message.user {
            justify-content: flex-end;
        }

        .avatar {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            flex-shrink: 0;
            font-weight: 800;
        }

        .assistant .avatar {
            background: #2563eb;
            color: white;
        }

        .user .avatar {
            background: #e5e7eb;
            color: #374151;
            order: 2;
        }

        .bubble {
            max-width: min(820px, 85%);
            padding: 14px 16px;
            border-radius: 16px;
            line-height: 1.65;
            white-space: pre-wrap;
            word-wrap: break-word;
        }

        .assistant .bubble {
            background: white;
            border: 1px solid #e2e8f0;
        }

        .user .bubble {
            background: #2563eb;
            color: white;
        }

        .bubble h1,
        .bubble h2,
        .bubble h3 {
            margin: 10px 0 7px;
        }

        .bubble strong {
            font-weight: 800;
        }

        .loading {
            display: inline-flex;
            gap: 5px;
            align-items: center;
        }

        .dot {
            width: 7px;
            height: 7px;
            border-radius: 50%;
            background: #64748b;
            animation: bounce 1s infinite;
        }

        .dot:nth-child(2) {
            animation-delay: 0.15s;
        }

        .dot:nth-child(3) {
            animation-delay: 0.3s;
        }

        @keyframes bounce {
            0%, 80%, 100% {
                transform: translateY(0);
                opacity: 0.4;
            }

            40% {
                transform: translateY(-5px);
                opacity: 1;
            }
        }

        /* =========================
           ACTION BUTTONS
        ========================== */

        .actions {
            display: flex;
            flex-wrap: wrap;
            gap: 7px;
            margin-top: 10px;
        }

        .action-btn {
            border: 1px solid #d7dee9;
            background: white;
            color: #374151;
            border-radius: 9px;
            padding: 7px 10px;
            font-size: 12px;
            cursor: pointer;
        }

        .action-btn:hover {
            background: #eef4ff;
            border-color: #a9c2ff;
        }

        /* =========================
           INPUT
        ========================== */

        .composer-wrap {
            position: fixed;
            bottom: 0;
            left: 260px;
            right: 0;
            padding: 16px 18px 18px;
            background: linear-gradient(
                transparent,
                #f8fafc 30%
            );
        }

        .composer {
            max-width: 950px;
            margin: 0 auto;
            background: white;
            border: 1px solid #d7dee9;
            border-radius: 16px;
            padding: 10px;
            box-shadow: 0 8px 30px rgba(15, 23, 42, 0.08);
        }

        .input-row {
            display: flex;
            gap: 8px;
            align-items: flex-end;
        }

        textarea {
            flex: 1;
            border: none;
            outline: none;
            resize: none;
            min-height: 46px;
            max-height: 150px;
            padding: 12px;
            font-size: 15px;
            line-height: 1.5;
            font-family: inherit;
        }

        .icon-btn,
        .send-btn {
            width: 44px;
            height: 44px;
            border-radius: 12px;
            border: none;
            cursor: pointer;
            flex-shrink: 0;
        }

        .icon-btn {
            background: #eef2f7;
            color: #344054;
            font-size: 18px;
        }

        .send-btn {
            background: #2563eb;
            color: white;
            font-size: 18px;
            font-weight: bold;
        }

        .send-btn:hover {
            background: #1d4ed8;
        }

        .send-btn:disabled {
            opacity: 0.55;
            cursor: not-allowed;
        }

        .hint {
            font-size: 11px;
            color: #8a94a6;
            padding: 5px 10px 2px;
        }

        /* =========================
           MOBILE
        ========================== */

        .overlay {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(15, 23, 42, 0.4);
            z-index: 15;
        }

        @media (max-width: 800px) {
            .sidebar {
                position: fixed;
                left: 0;
                top: 0;
                bottom: 0;
                transform: translateX(-100%);
            }

            .sidebar.open {
                transform: translateX(0);
            }

            .overlay.show {
                display: block;
            }

            .main {
                width: 100%;
            }

            .menu-btn {
                display: block;
            }

            .composer-wrap {
                left: 0;
            }

            .chat {
                padding: 20px 12px 145px;
            }

            .welcome {
                margin-top: 45px;
            }

            .welcome h1 {
                font-size: 30px;
            }

            .bubble {
                max-width: 90%;
            }

            .status {
                display: none;
            }
        }

        @media (max-width: 480px) {
            .topbar {
                padding: 0 12px;
            }

            .top-title {
                font-size: 16px;
            }

            .message {
                gap: 8px;
                margin-bottom: 18px;
            }

            .avatar {
                width: 31px;
                height: 31px;
                font-size: 13px;
            }

            .bubble {
                font-size: 14px;
                padding: 12px 13px;
            }

            .action-btn {
                font-size: 11px;
                padding: 6px 8px;
            }

            textarea {
                font-size: 14px;
            }
        }
    </style>
</head>

<body>

<div class="app">

    <aside class="sidebar" id="sidebar">
        <div class="brand">🤖 My AI</div>

        <button class="new-chat" onclick="newChat()">
            ＋ New Chat
        </button>

        <div class="sidebar-title">
            Recent chats
        </div>

        <div class="history" id="history"></div>
    </aside>

    <div class="overlay" id="overlay" onclick="closeSidebar()"></div>

    <main class="main">

        <header class="topbar">
            <button
                class="menu-btn"
                onclick="toggleSidebar()"
                aria-label="Open menu"
            >
                ☰
            </button>

            <div class="top-title">
                My AI
            </div>

            <div class="status">
                ● Online
            </div>
        </header>

        <section class="chat" id="chat">
            <div class="chat-inner" id="chatInner">

                <div class="welcome" id="welcome">
                    <h1>🤖 My AI</h1>

                    <p>
                        Hello! I'm your AI study assistant.
                        Ask me Mathematics, Physics, Chemistry,
                        Biology, Science, or general questions.
                    </p>
                </div>

            </div>
        </section>

        <div class="composer-wrap">
            <div class="composer">

                <div class="input-row">

                    <button
                        class="icon-btn"
                        onclick="startDictation()"
                        title="Dictation"
                        aria-label="Dictation"
                    >
                        🎤
                    </button>

                    <textarea
                        id="messageInput"
                        placeholder="Ask My AI anything..."
                        rows="1"
                        oninput="autoResize(this)"
                        onkeydown="handleKey(event)"
                    ></textarea>

                    <button
                        class="send-btn"
                        id="sendButton"
                        onclick="sendMessage()"
                        title="Send"
                        aria-label="Send"
                    >
                        ➤
                    </button>

                </div>

                <div class="hint">
                    Press Enter to send • Shift + Enter for a new line
                </div>

            </div>
        </div>

    </main>

</div>


<script>
    const chat = document.getElementById("chat");
    const chatInner = document.getElementById("chatInner");
    const input = document.getElementById("messageInput");
    const sendButton = document.getElementById("sendButton");
    const welcome = document.getElementById("welcome");

    let busy = false;

    // ========================================================
    // MARKDOWN-LIKE FORMATTER
    // ========================================================

    function escapeHtml(text) {
        return text
            .replace(/&/g, "&amp;")
            .replace(/</g, "&lt;")
            .replace(/>/g, "&gt;");
    }

    function formatAnswer(text) {
        let html = escapeHtml(text);

        // Bold
        html = html.replace(
            /\*\*(.*?)\*\*/gs,
            "<strong>$1</strong>"
        );

        // Headings
        html = html.replace(
            /^### (.*?)$/gm,
            "<h3>$1</h3>"
        );

        html = html.replace(
            /^## (.*?)$/gm,
            "<h2>$1</h2>"
        );

        html = html.replace(
            /^# (.*?)$/gm,
            "<h1>$1</h1>"
        );

        // Simple bullet lists
        html = html.replace(
            /^- (.*?)$/gm,
            "• $1"
        );

        // Preserve line breaks
        html = html.replace(
            /\n/g,
            "<br>"
        );

        return html;
    }


    // ========================================================
    // CREATE MESSAGE
    // ========================================================

    function addMessage(
        role,
        text = "",
        showActions = false
    ) {
        const message = document.createElement("div");

        message.className =
            "message " +
            (role === "user"
                ? "user"
                : "assistant");

        const avatar = document.createElement("div");
        avatar.className = "avatar";

        avatar.textContent =
            role === "user"
                ? "U"
                : "🤖";

        const bubble = document.createElement("div");
        bubble.className = "bubble";

        if (text) {
            bubble.innerHTML =
                formatAnswer(text);
        }

        message.appendChild(avatar);
        message.appendChild(bubble);

        chatInner.appendChild(message);

        if (
            role === "assistant" &&
            showActions
        ) {
            addActions(message, text);
        }

        scrollToBottom();

        return {
            message,
            bubble
        };
    }


    // ========================================================
    // ACTION BUTTONS
    // ========================================================

    function addActions(message, answer) {
        const actions = document.createElement("div");
        actions.className = "actions";

        const buttons = [
            ["🔄 Improve Answer", "improve"],
            ["🔎 Check Again", "check"],
            ["📚 Explain More", "explain"],
            ["⚡ Make Shorter", "short"],
            ["🔊 Read Answer", "read"]
        ];

        buttons.forEach(
            ([label, action]) => {
                const button =
                    document.createElement("button");

                button.className = "action-btn";
                button.textContent = label;

                button.onclick = () => {
                    if (action === "read") {
                        readAnswer(answer);
                    } else {
                        improveAnswer(
                            action,
                            answer,
                            button
                        );
                    }
                };

                actions.appendChild(button);
            }
        );

        message.querySelector(
            ".bubble"
        ).appendChild(actions);
    }


    // ========================================================
    // SEND MESSAGE
    // ========================================================

    async function sendMessage() {
        if (busy) return;

        const message =
            input.value.trim();

        if (!message) return;

        busy = true;
        sendButton.disabled = true;

        if (welcome) {
            welcome.remove();
        }

        addMessage(
            "user",
            message
        );

        input.value = "";
        autoResize(input);

        const responseData =
            addMessage(
                "assistant",
                ""
            );

        responseData.bubble.innerHTML = `
            <div class="loading">
                <span class="dot"></span>
                <span class="dot"></span>
                <span class="dot"></span>
            </div>
        `;

        try {
            const response =
                await fetch(
                    "/chat",
                    {
                        method: "POST",
                        headers: {
                            "Content-Type":
                                "application/json"
                        },
                        body: JSON.stringify({
                            message: message
                        })
                    }
                );

            if (!response.ok) {
                throw new Error(
                    "Server error"
                );
            }

            const reader =
                response.body.getReader();

            const decoder =
                new TextDecoder();

            let answer = "";

            responseData.bubble.innerHTML =
                "";

            while (true) {
                const {
                    value,
                    done
                } = await reader.read();

                if (done) break;

                answer +=
                    decoder.decode(
                        value,
                        {
                            stream: true
                        }
                    );

                responseData.bubble.innerHTML =
                    formatAnswer(answer);

                scrollToBottom();
            }

            if (!answer.trim()) {
                answer =
                    "I couldn't generate an answer.";
            }

            responseData.bubble.innerHTML =
                formatAnswer(answer);

            addActions(
                responseData.message,
                answer
            );

            addHistory(message);

        } catch (error) {

            responseData.bubble.innerHTML =
                `<strong>❌ Something went wrong.</strong><br><br>
                 Please try again.`;

            console.error(
                "Chat error:",
                error
            );
        }

        busy = false;
        sendButton.disabled = false;

        input.focus();
        scrollToBottom();
    }


    // ========================================================
    // IMPROVE ANSWER
    // ========================================================

    async function improveAnswer(
        action,
        oldAnswer,
        button
    ) {
        if (busy) return;

        const messageBlocks =
            document.querySelectorAll(
                ".message"
            );

        let question = "";

        for (
            let i = messageBlocks.length - 1;
            i >= 0;
            i--
        ) {
            if (
                messageBlocks[i]
                    .classList.contains("user")
            ) {
                const bubble =
                    messageBlocks[i]
                        .querySelector(".bubble");

                question =
                    bubble.innerText.trim();

                break;
            }
        }

        if (!question) {
            return;
        }

        busy = true;

        const oldText =
            button.textContent;

        button.textContent =
            "⏳ Working...";

        button.disabled = true;

        const responseData =
            addMessage(
                "assistant",
                ""
            );

        responseData.bubble.innerHTML =
            `<div class="loading">
                <span class="dot"></span>
                <span class="dot"></span>
                <span class="dot"></span>
             </div>`;

        try {
            const response =
                await fetch(
                    "/improve",
                    {
                        method: "POST",
                        headers: {
                            "Content-Type":
                                "application/json"
                        },
                        body: JSON.stringify({
                            question: question,
                            answer: oldAnswer,
                            action: action
                        })
                    }
                );

            if (!response.ok) {
                throw new Error(
                    "Improve request failed"
                );
            }

            const reader =
                response.body.getReader();

            const decoder =
                new TextDecoder();

            let answer = "";

            responseData.bubble.innerHTML =
                "";

            while (true) {
                const {
                    value,
                    done
                } = await reader.read();

                if (done) break;

                answer +=
                    decoder.decode(
                        value,
                        {
                            stream: true
                        }
                    );

                responseData.bubble.innerHTML =
                    formatAnswer(answer);

                scrollToBottom();
            }

            responseData.bubble.innerHTML =
                formatAnswer(answer);

            addActions(
                responseData.message,
                answer
            );

        } catch (error) {

            responseData.bubble.innerHTML =
                `<strong>❌ Something went wrong.</strong>`;

            console.error(
                "Improve error:",
                error
            );
        }

        button.textContent =
            oldText;

        button.disabled = false;

        busy = false;

        scrollToBottom();
    }


    // ========================================================
    // READ ANSWER
    // ========================================================

    function readAnswer(text) {
        if (
            !("speechSynthesis" in window)
        ) {
            alert(
                "Text-to-speech is not supported."
            );
            return;
        }

        window.speechSynthesis.cancel();

        const cleanText =
            text
                .replace(
                    /[*#]/g,
                    ""
                )
                .replace(
                    /\n+/g,
                    ". "
                );

        const speech =
            new SpeechSynthesisUtterance(
                cleanText
            );

        speech.rate = 0.95;
        speech.pitch = 1;

        window.speechSynthesis.speak(
            speech
        );
    }


    // ========================================================
    // DICTATION
    // ========================================================

    function startDictation() {
        const SpeechRecognition =
            window.SpeechRecognition ||
            window.webkitSpeechRecognition;

        if (!SpeechRecognition) {
            alert(
                "Voice dictation is not supported in this browser."
            );
            return;
        }

        const recognition =
            new SpeechRecognition();

        recognition.lang = "en-IN";
        recognition.interimResults = true;
        recognition.continuous = false;

        recognition.onstart = () => {
            input.placeholder =
                "Listening...";
        };

        recognition.onresult = (
            event
        ) => {
            let text = "";

            for (
                let i = event.resultIndex;
                i < event.results.length;
                i++
            ) {
                text +=
                    event.results[i][0]
                        .transcript;
            }

            input.value = text;
            autoResize(input);
        };

        recognition.onerror = () => {
            input.placeholder =
                "Ask My AI anything...";
        };

        recognition.onend = () => {
            input.placeholder =
                "Ask My AI anything...";
        };

        recognition.start();
    }


    // ========================================================
    // KEYBOARD
    // ========================================================

    function handleKey(event) {
        if (
            event.key === "Enter" &&
            !event.shiftKey
        ) {
            event.preventDefault();
            sendMessage();
        }
    }


    // ========================================================
    // AUTO RESIZE
    // ========================================================

    function autoResize(textarea) {
        textarea.style.height =
            "auto";

        textarea.style.height =
            Math.min(
                textarea.scrollHeight,
                150
            ) + "px";
    }


    // ========================================================
    // SCROLL
    // ========================================================

    function scrollToBottom() {
        setTimeout(() => {
            chat.scrollTop =
                chat.scrollHeight;
        }, 20);
    }


    // ========================================================
    // HISTORY
    // ========================================================

    function addHistory(text) {
        const history =
            document.getElementById(
                "history"
            );

        const item =
            document.createElement(
                "div"
            );

        item.className =
            "history-item";

        item.textContent =
            text;

        item.onclick = () => {
            input.value = text;
            autoResize(input);
            input.focus();
        };

        history.prepend(item);

        while (
            history.children.length > 20
        ) {
            history.removeChild(
                history.lastChild
            );
        }
    }


    // ========================================================
    // NEW CHAT
    // ========================================================

    function newChat() {
        chatInner.innerHTML = `
            <div class="welcome" id="welcome">
                <h1>🤖 My AI</h1>
                <p>
                    Hello! I'm your AI study assistant.
                    Ask me Mathematics, Physics, Chemistry,
                    Biology, Science, or general questions.
                </p>
            </div>
        `;

        input.value = "";
        autoResize(input);
        input.focus();

        closeSidebar();
    }


    // ========================================================
    // MOBILE SIDEBAR
    // ========================================================

    function toggleSidebar() {
        document
            .getElementById("sidebar")
            .classList.toggle("open");

        document
            .getElementById("overlay")
            .classList.toggle("show");
    }

    function closeSidebar() {
        document
            .getElementById("sidebar")
            .classList.remove("open");

        document
            .getElementById("overlay")
            .classList.remove("show");
    }


    // ========================================================
    // STARTUP
    // ========================================================

    input.focus();

</script>

</body>
</html>
