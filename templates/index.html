<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>My AI</title>

    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            height: 100vh;
            font-family: Arial, Helvetica, sans-serif;
            background: #eef2f7;
        }

        .app {
            width: 100%;
            max-width: 950px;
            height: 100vh;
            margin: auto;

            display: flex;
            flex-direction: column;

            background: white;
        }

        /* ================= HEADER ================= */

        .header {
            height: 65px;
            padding: 0 18px;

            display: flex;
            align-items: center;
            justify-content: space-between;

            background: #111827;
            color: white;

            flex-shrink: 0;
        }

        .logo {
            font-size: 21px;
            font-weight: bold;
        }

        .new-chat {
            border: none;
            border-radius: 9px;

            padding: 9px 14px;

            background: #374151;
            color: white;

            cursor: pointer;

            font-size: 14px;
        }

        .new-chat:hover {
            background: #4b5563;
        }

        /* ================= MESSAGES ================= */

        .messages {
            flex: 1;
            overflow-y: auto;
            padding: 22px;
        }

        .message {
            max-width: 85%;
            margin-bottom: 18px;
            padding: 14px 16px;

            border-radius: 14px;

            line-height: 1.6;

            word-wrap: break-word;
            overflow-wrap: break-word;
        }

        .message.user {
            margin-left: auto;
            background: #2563eb;
            color: white;
        }

        .message.ai {
            background: #f1f3f5;
            color: #111827;
        }

        /* ================= MARKDOWN ================= */

        .message.ai h1,
        .message.ai h2,
        .message.ai h3 {
            margin-top: 8px;
            margin-bottom: 10px;
        }

        .message.ai h3 {
            font-size: 18px;
        }

        .message.ai p {
            margin: 7px 0;
        }

        .message.ai ul,
        .message.ai ol {
            padding-left: 25px;
        }

        .message.ai li {
            margin-bottom: 7px;
        }

        .message.ai strong {
            font-weight: 700;
        }

        .message.ai code {
            padding: 2px 5px;
            background: #e5e7eb;
            border-radius: 5px;
        }

        /* ================= ACTION BUTTONS ================= */

        .answer-actions {
            display: flex;
            flex-wrap: wrap;
            gap: 7px;

            margin-top: 13px;
            padding-top: 10px;

            border-top: 1px solid #d1d5db;
        }

        .action-button {
            border: 1px solid #cbd5e1;
            border-radius: 8px;

            padding: 7px 10px;

            background: white;
            color: #374151;

            cursor: pointer;

            font-size: 12px;
        }

        .action-button:hover {
            background: #e5e7eb;
        }

        .action-button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        /* ================= READ BUTTON ================= */

        .speak-button {
            border: 1px solid #cbd5e1;
            border-radius: 8px;

            padding: 7px 10px;

            background: white;
            color: #374151;

            cursor: pointer;

            font-size: 12px;
        }

        .speak-button:hover {
            background: #e5e7eb;
        }

        .speak-button.speaking {
            background: #fee2e2;
            color: #991b1b;
        }

        /* ================= INPUT ================= */

        .input-area {
            display: flex;
            align-items: center;

            gap: 8px;

            padding: 12px;

            border-top: 1px solid #d1d5db;

            flex-shrink: 0;
        }

        #messageInput {
            flex: 1;
            min-width: 0;

            height: 46px;

            padding: 0 14px;

            border: 1px solid #b8c0cc;
            border-radius: 10px;

            font-size: 16px;

            outline: none;
        }

        #messageInput:focus {
            border-color: #2563eb;
        }

        .voice-button {
            width: 46px;
            height: 46px;

            border: none;
            border-radius: 10px;

            background: #e5e7eb;
            color: #111827;

            cursor: pointer;

            font-size: 20px;
        }

        .voice-button:hover {
            background: #d1d5db;
        }

        .voice-button.listening {
            background: #ef4444;
            color: white;

            animation: pulse 1s infinite;
        }

        @keyframes pulse {
            0% {
                transform: scale(1);
            }

            50% {
                transform: scale(1.08);
            }

            100% {
                transform: scale(1);
            }
        }

        .send-button {
            height: 46px;

            padding: 0 20px;

            border: none;
            border-radius: 10px;

            background: #2563eb;
            color: white;

            cursor: pointer;

            font-size: 16px;
        }

        .send-button:hover {
            background: #1d4ed8;
        }

        .send-button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        /* ================= THINKING ================= */

        .thinking {
            color: #6b7280;
            font-style: italic;
        }

        /* ================= MOBILE ================= */

        @media (max-width: 650px) {

            .header {
                height: 58px;
                padding: 0 12px;
            }

            .logo {
                font-size: 18px;
            }

            .messages {
                padding: 14px;
            }

            .message {
                max-width: 95%;
                padding: 12px;
            }

            .input-area {
                padding: 9px;
                gap: 6px;
            }

            #messageInput {
                height: 44px;
                font-size: 15px;
            }

            .voice-button {
                width: 44px;
                height: 44px;
            }

            .send-button {
                height: 44px;
                padding: 0 14px;
                font-size: 15px;
            }

            .action-button,
            .speak-button {
                font-size: 11px;
            }
        }
    </style>
</head>

<body>

<div class="app">

    <!-- HEADER -->

    <div class="header">

        <div class="logo">
            🤖 My AI
        </div>

        <button
            id="newChatButton"
            class="new-chat">
            + New Chat
        </button>

    </div>


    <!-- MESSAGES -->

    <div
        id="messages"
        class="messages">

        <div class="message ai">

            Hello! I'm your AI. Ask me something. 👋

        </div>

    </div>


    <!-- INPUT -->

    <div class="input-area">

        <button
            id="voiceButton"
            class="voice-button"
            title="Speak">
            🎤
        </button>

        <input
            id="messageInput"
            type="text"
            placeholder="Ask anything..."
            autocomplete="off"
            maxlength="5000"
        >

        <button
            id="sendButton"
            class="send-button">
            Send
        </button>

    </div>

</div>


<script>

/* ============================================================
   ELEMENTS
============================================================ */

const input =
    document.getElementById("messageInput");

const messages =
    document.getElementById("messages");

const sendButton =
    document.getElementById("sendButton");

const newChatButton =
    document.getElementById("newChatButton");

const voiceButton =
    document.getElementById("voiceButton");


/* ============================================================
   MARKDOWN
============================================================ */

function renderMarkdown(text) {

    if (typeof marked === "undefined") {

        return text
            .replace(/&/g, "&amp;")
            .replace(/</g, "&lt;")
            .replace(/>/g, "&gt;")
            .replace(/\n/g, "<br>");

    }

    return marked.parse(text);
}


/* ============================================================
   SCROLL
============================================================ */

function scrollBottom() {
    messages.scrollTop = messages.scrollHeight;
}


/* ============================================================
   USER MESSAGE
============================================================ */

function addUserMessage(text) {

    const div =
        document.createElement("div");

    div.className = "message user";

    div.textContent = text;

    messages.appendChild(div);

    scrollBottom();
}


/* ============================================================
   AI MESSAGE
============================================================ */

function addAIMessage() {

    const div =
        document.createElement("div");

    div.className = "message ai";

    messages.appendChild(div);

    scrollBottom();

    return div;
}


/* ============================================================
   READ ANSWER
============================================================ */

let currentSpeech = null;

function speakAnswer(text, button) {

    if (!("speechSynthesis" in window)) {

        alert(
            "Text-to-speech is not supported in this browser."
        );

        return;
    }

    if (speechSynthesis.speaking) {

        speechSynthesis.cancel();

        button.textContent = "🔊 Read Answer";
        button.classList.remove("speaking");

        return;
    }

    // Remove markdown.
    const plainText =
        text
            .replace(/#{1,6}\s/g, "")
            .replace(/\*\*/g, "")
            .replace(/```[\s\S]*?```/g, "")
            .replace(/`/g, "")
            .replace(/\$+/g, "")
            .trim();

    currentSpeech =
        new SpeechSynthesisUtterance(
            plainText
        );

    currentSpeech.rate = 1;
    currentSpeech.pitch = 1;
    currentSpeech.volume = 1;

    currentSpeech.onstart = function() {

        button.textContent =
            "⏹ Stop";

        button.classList.add(
            "speaking"
        );
    };

    currentSpeech.onend = function() {

        button.textContent =
            "🔊 Read Answer";

        button.classList.remove(
            "speaking"
        );
    };

    currentSpeech.onerror = function() {

        button.textContent =
            "🔊 Read Answer";

        button.classList.remove(
            "speaking"
        );
    };

    speechSynthesis.speak(
        currentSpeech
    );
}


/* ============================================================
   ACTION BUTTONS
============================================================ */

function addActionButtons(
    aiMessage,
    question,
    answer
) {

    const container =
        document.createElement("div");

    container.className =
        "answer-actions";


    const improveActions = [

        {
            label: "🔄 Improve Answer",
            action: "improve"
        },

        {
            label: "🔎 Check Again",
            action: "check"
        },

        {
            label: "📚 Explain More",
            action: "explain"
        },

        {
            label: "⚡ Make Shorter",
            action: "short"
        }

    ];


    improveActions.forEach(
        item => {

            const button =
                document.createElement(
                    "button"
                );

            button.className =
                "action-button";

            button.textContent =
                item.label;


            button.addEventListener(
                "click",
                function() {

                    improveAnswer(
                        aiMessage,
                        question,
                        answer,
                        item.action,
                        container
                    );

                }
            );


            container.appendChild(
                button
            );

        }
    );


    // Read Answer button

    const speakButton =
        document.createElement(
            "button"
        );

    speakButton.className =
        "speak-button";

    speakButton.textContent =
        "🔊 Read Answer";


    speakButton.addEventListener(
        "click",
        function() {

            speakAnswer(
                answer,
                speakButton
            );

        }
    );


    container.appendChild(
        speakButton
    );


    aiMessage.appendChild(
        container
    );
}


/* ============================================================
   IMPROVE ANSWER
============================================================ */

async function improveAnswer(
    aiMessage,
    question,
    oldAnswer,
    action,
    oldButtons
) {

    oldButtons.remove();

    aiMessage.innerHTML =
        `<div class="thinking">
            🤖 Improving answer...
        </div>`;


    try {

        const response =
            await fetch(
                "/improve",
                {
                    method: "POST",

                    headers: {
                        "Content-Type":
                            "application/json"
                    },

                    body: JSON.stringify({

                        question:
                            question,

                        answer:
                            oldAnswer,

                        action:
                            action

                    })
                }
            );


        if (!response.ok) {

            throw new Error(
                "Server error: " +
                response.status
            );

        }


        const reader =
            response.body.getReader();

        const decoder =
            new TextDecoder(
                "utf-8"
            );

        let result = "";


        while (true) {

            const chunk =
                await reader.read();

            if (chunk.done) {
                break;
            }


            result +=
                decoder.decode(
                    chunk.value,
                    {
                        stream: true
                    }
                );


            aiMessage.innerHTML =
                renderMarkdown(
                    result
                );


            scrollBottom();

        }


        result +=
            decoder.decode();


        aiMessage.innerHTML =
            renderMarkdown(
                result
            );


        addActionButtons(
            aiMessage,
            question,
            result
        );


    } catch (error) {

        console.error(error);

        aiMessage.innerHTML =
            renderMarkdown(
                oldAnswer
            );


        addActionButtons(
            aiMessage,
            question,
            oldAnswer
        );

    }
}


/* ============================================================
   SEND MESSAGE
============================================================ */

async function sendMessage() {

    const text =
        input.value.trim();

    if (!text) {
        return;
    }


    addUserMessage(text);

    input.value = "";

    sendButton.disabled = true;
    input.disabled = true;
    voiceButton.disabled = true;


    const aiMessage =
        addAIMessage();


    aiMessage.innerHTML =
        `<div class="thinking">
            🤖 Thinking...
        </div>`;


    try {

        const response =
            await fetch(
                "/chat",
                {
                    method: "POST",

                    headers: {
                        "Content-Type":
                            "application/json"
                    },

                    body: JSON.stringify({
                        message:
                            text
                    })
                }
            );


        if (!response.ok) {

            throw new Error(
                "Server error: " +
                response.status
            );

        }


        const reader =
            response.body.getReader();

        const decoder =
            new TextDecoder(
                "utf-8"
            );

        let result = "";


        while (true) {

            const chunk =
                await reader.read();

            if (chunk.done) {
                break;
            }


            result +=
                decoder.decode(
                    chunk.value,
                    {
                        stream: true
                    }
                );


            aiMessage.innerHTML =
                renderMarkdown(
                    result
                );


            scrollBottom();

        }


        result +=
            decoder.decode();


        if (!result.trim()) {

            result =
                "I couldn't generate a response.";

        }


        aiMessage.innerHTML =
            renderMarkdown(
                result
            );


        addActionButtons(
            aiMessage,
            text,
            result
        );


    } catch (error) {

        console.error(
            "Chat error:",
            error
        );


        aiMessage.innerHTML = `
            <strong>
                ❌ Something went wrong.
            </strong>
            <br>
            Please make sure Flask and Ollama are running.
        `;

    } finally {

        sendButton.disabled = false;
        input.disabled = false;
        voiceButton.disabled = false;

        input.focus();

    }
}


/* ============================================================
   VOICE DICTATION
============================================================ */

const SpeechRecognition =
    window.SpeechRecognition ||
    window.webkitSpeechRecognition;

let recognition = null;
let listening = false;

if (SpeechRecognition) {

    recognition =
        new SpeechRecognition();

    recognition.continuous = false;

    recognition.interimResults = true;

    recognition.lang = "en-IN";


    recognition.onstart = function() {

        listening = true;

        voiceButton.classList.add(
            "listening"
        );

        voiceButton.textContent =
            "⏹";

    };


    recognition.onresult =
        function(event) {

            let finalText = "";
            let interimText = "";


            for (
                let i = event.resultIndex;
                i < event.results.length;
                i++
            ) {

                const transcript =
                    event.results[i][0].transcript;


                if (
                    event.results[i].isFinal
                ) {

                    finalText +=
                        transcript;

                } else {

                    interimText +=
                        transcript;

                }

            }


            if (finalText) {

                // Add a space if there is already text.
                if (input.value.trim()) {

                    input.value +=
                        " " +
                        finalText.trim();

                } else {

                    input.value =
                        finalText.trim();

                }

            }

        };


    recognition.onend = function() {

        listening = false;

        voiceButton.classList.remove(
            "listening"
        );

        voiceButton.textContent =
            "🎤";

    };


    recognition.onerror =
        function(event) {

            console.error(
                "Speech recognition error:",
                event.error
            );

            listening = false;

            voiceButton.classList.remove(
                "listening"
            );

            voiceButton.textContent =
                "🎤";

            if (
                event.error ===
                "not-allowed"
            ) {

                alert(
                    "Please allow microphone access for My AI."
                );

            }

        };


    voiceButton.addEventListener(
        "click",
        function() {

            if (listening) {

                recognition.stop();

                return;
            }


            try {

                recognition.start();

            } catch (error) {

                console.error(
                    error
                );

            }

        }
    );

} else {

    voiceButton.addEventListener(
        "click",
        function() {

            alert(
                "Voice input is not supported in this browser. " +
                "Try Google Chrome or Microsoft Edge."
            );

        }
    );

}


/* ============================================================
   ENTER KEY
============================================================ */

input.addEventListener(
    "keydown",
    function(event) {

        if (event.key === "Enter") {

            event.preventDefault();

            sendMessage();

        }

    }
);


/* ============================================================
   BUTTONS
============================================================ */

sendButton.addEventListener(
    "click",
    sendMessage
);


newChatButton.addEventListener(
    "click",
    function() {

        // Stop speech if active.
        if (
            "speechSynthesis" in window
        ) {

            speechSynthesis.cancel();

        }


        messages.innerHTML = `
            <div class="message ai">
                Hello! I'm your AI. Ask me something. 👋
            </div>
        `;


        input.value = "";

        input.disabled = false;

        sendButton.disabled = false;

        voiceButton.disabled = false;

        input.focus();

    }
);


/* ============================================================
   INITIAL FOCUS
============================================================ */

window.addEventListener(
    "load",
    function() {

        input.focus();

    }
);

</script>

</body>
</html>
