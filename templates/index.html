<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My AI</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, Helvetica, sans-serif;
            background: #f3f6fb;
            color: #182033;
        }

        button,
        input,
        textarea {
            font-family: inherit;
        }

        /* =========================
           AUTH
        ========================= */

        .auth-screen {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .auth-box {
            width: 100%;
            max-width: 430px;
            background: white;
            padding: 30px;
            border-radius: 20px;
            box-shadow: 0 15px 45px rgba(0, 0, 0, 0.1);
        }

        .logo {
            text-align: center;
            font-size: 34px;
            font-weight: 800;
            color: #2563eb;
            margin-bottom: 7px;
        }

        .subtitle {
            text-align: center;
            color: #667085;
            margin-bottom: 25px;
        }

        .tabs {
            display: flex;
            gap: 8px;
            margin-bottom: 20px;
        }

        .tab {
            flex: 1;
            padding: 11px;
            border: none;
            border-radius: 10px;
            background: #eef2f7;
            cursor: pointer;
            font-weight: 700;
        }

        .tab.active {
            background: #2563eb;
            color: white;
        }

        .auth-form {
            display: none;
        }

        .auth-form.active {
            display: block;
        }

        .field {
            margin-bottom: 14px;
        }

        .field label {
            display: block;
            margin-bottom: 6px;
            font-size: 13px;
            font-weight: 700;
        }

        .field label span {
            color: #667085;
            font-weight: 400;
        }

        .field input {
            width: 100%;
            padding: 12px 13px;
            border: 1px solid #d4dbe7;
            border-radius: 10px;
            outline: none;
            font-size: 14px;
        }

        .field input:focus {
            border-color: #2563eb;
        }

        .password-wrap {
            position: relative;
        }

        .password-wrap input {
            padding-right: 45px;
        }

        .show-password {
            position: absolute;
            right: 9px;
            top: 50%;
            transform: translateY(-50%);
            border: none;
            background: transparent;
            cursor: pointer;
            font-size: 16px;
        }

        .auth-button {
            width: 100%;
            border: none;
            background: #2563eb;
            color: white;
            padding: 13px;
            border-radius: 10px;
            font-weight: 800;
            cursor: pointer;
        }

        .auth-button:hover {
            background: #1d4ed8;
        }

        .auth-message {
            margin-top: 12px;
            min-height: 20px;
            text-align: center;
            color: #dc2626;
            font-size: 13px;
        }

        /* =========================
           APP
        ========================= */

        .app {
            min-height: 100vh;
            display: flex;
        }

        .sidebar {
            width: 250px;
            background: white;
            border-right: 1px solid #dfe5ef;
            padding: 18px;
            display: flex;
            flex-direction: column;
            flex-shrink: 0;
        }

        .brand {
            color: #2563eb;
            font-size: 23px;
            font-weight: 800;
            margin-bottom: 20px;
        }

        .new-chat {
            border: none;
            background: #2563eb;
            color: white;
            padding: 12px;
            border-radius: 10px;
            font-weight: 700;
            cursor: pointer;
        }

        .new-chat:hover {
            background: #1d4ed8;
        }

        .sidebar-bottom {
            margin-top: auto;
            border-top: 1px solid #e5e7eb;
            padding-top: 14px;
            font-size: 13px;
        }

        .logout {
            width: 100%;
            margin-top: 10px;
            padding: 9px;
            border: 1px solid #d7dee9;
            background: white;
            border-radius: 9px;
            cursor: pointer;
        }

        .main {
            flex: 1;
            min-width: 0;
            display: flex;
            flex-direction: column;
        }

        .topbar {
            height: 60px;
            background: white;
            border-bottom: 1px solid #dfe5ef;
            display: flex;
            align-items: center;
            padding: 0 18px;
        }

        .top-title {
            font-size: 18px;
            font-weight: 800;
        }

        .chat {
            flex: 1;
            overflow-y: auto;
            padding: 25px 15px 165px;
        }

        .chat-inner {
            max-width: 900px;
            margin: 0 auto;
        }

        .welcome {
            text-align: center;
            margin-top: 100px;
        }

        .welcome h1 {
            font-size: 38px;
            margin-bottom: 10px;
        }

        .welcome p {
            color: #667085;
            line-height: 1.6;
        }

        /* =========================
           MESSAGES
        ========================= */

        .message {
            display: flex;
            gap: 10px;
            margin-bottom: 22px;
            align-items: flex-start;
        }

        .message.user {
            justify-content: flex-end;
        }

        .avatar {
            width: 36px;
            height: 36px;
            flex-shrink: 0;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 700;
        }

        .assistant .avatar {
            background: #2563eb;
            color: white;
        }

        .user .avatar {
            background: #e5e7eb;
            color: #374151;
            order: 2;
        }

        .bubble {
            max-width: 86%;
            padding: 14px;
            border-radius: 15px;
            line-height: 1.65;
            white-space: pre-wrap;
            word-break: break-word;
        }

        .assistant .bubble {
            background: white;
            border: 1px solid #e2e8f0;
        }

        .user .bubble {
            background: #2563eb;
            color: white;
        }

        .bubble h2,
        .bubble h3 {
            margin: 8px 0;
        }

        /* =========================
           ACTION BUTTONS
        ========================= */

        .actions {
            display: flex;
            flex-wrap: wrap;
            gap: 7px;
            margin-top: 10px;
        }

        .action-btn {
            padding: 6px 9px;
            border: 1px solid #d7dee9;
            background: white;
            color: #374151;
            border-radius: 8px;
            cursor: pointer;
            font-size: 12px;
        }

        .action-btn:hover {
            background: #eef4ff;
        }

        /* =========================
           IMAGE
        ========================= */

        .image-preview-wrap {
            display: none;
            padding: 8px 8px 5px;
        }

        .image-preview {
            display: block;
            max-width: 260px;
            max-height: 180px;
            border-radius: 10px;
            border: 1px solid #d7dee9;
            object-fit: contain;
        }

        .remove-image {
            margin-top: 7px;
            border: none;
            background: #fee2e2;
            color: #b91c1c;
            border-radius: 7px;
            padding: 6px 9px;
            cursor: pointer;
            font-size: 12px;
        }

        /* =========================
           COMPOSER
        ========================= */

        .composer {
            position: fixed;
            left: 250px;
            right: 0;
            bottom: 0;
            padding: 15px;
            background: linear-gradient(
                transparent,
                #f3f6fb 30%
            );
        }

        .composer-box {
            max-width: 900px;
            margin: 0 auto;
            background: white;
            border: 1px solid #d7dee9;
            border-radius: 15px;
            padding: 8px;
            box-shadow: 0 7px 25px rgba(15, 23, 42, 0.08);
        }

        .input-row {
            display: flex;
            gap: 7px;
            align-items: flex-end;
        }

        .icon-btn,
        .send-btn {
            width: 44px;
            height: 44px;
            flex-shrink: 0;
            border: none;
            border-radius: 11px;
            cursor: pointer;
        }

        .icon-btn {
            background: #eef2f7;
            color: #374151;
            font-size: 18px;
        }

        .icon-btn:hover {
            background: #e2e8f0;
        }

        /* Custom microphone */
        .voice-btn {
            position: relative;
            width: 44px;
            height: 44px;
            flex-shrink: 0;
            border: none;
            border-radius: 50%;
            background: #eef2f7;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .voice-btn:hover {
            background: #e2e8f0;
        }

        .mic-body {
            position: relative;
            width: 13px;
            height: 19px;
            background: #111827;
            border-radius: 8px;
        }

        .mic-body::before {
            content: "";
            position: absolute;
            left: -5px;
            bottom: -7px;
            width: 19px;
            height: 16px;
            border: 2px solid #111827;
            border-top: none;
            border-radius: 0 0 12px 12px;
        }

        .mic-body::after {
            content: "";
            position: absolute;
            left: 5px;
            bottom: -14px;
            width: 3px;
            height: 8px;
            background: #111827;
            border-radius: 2px;
        }

        .send-btn {
            background: #2563eb;
            color: white;
            font-size: 18px;
            font-weight: 800;
        }

        .send-btn:hover {
            background: #1d4ed8;
        }

        .send-btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        textarea {
            flex: 1;
            min-height: 44px;
            max-height: 150px;
            padding: 11px;
            resize: none;
            border: none;
            outline: none;
            font-size: 15px;
            line-height: 1.5;
        }

        /* =========================
           LOADING
        ========================= */

        .loading {
            display: inline-flex;
            gap: 5px;
            align-items: center;
        }

        .loading span {
            width: 7px;
            height: 7px;
            border-radius: 50%;
            background: #64748b;
            animation: bounce 1s infinite;
        }

        .loading span:nth-child(2) {
            animation-delay: 0.15s;
        }

        .loading span:nth-child(3) {
            animation-delay: 0.3s;
        }

        @keyframes bounce {
            0%,
            80%,
            100% {
                transform: translateY(0);
                opacity: 0.35;
            }

            40% {
                transform: translateY(-5px);
                opacity: 1;
            }
        }

        /* =========================
           MOBILE
        ========================= */

        @media (max-width: 760px) {
            .sidebar {
                display: none;
            }

            .composer {
                left: 0;
                padding: 10px;
            }

            .chat {
                padding: 20px 10px 145px;
            }

            .bubble {
                max-width: 92%;
            }

            .welcome {
                margin-top: 55px;
            }

            .welcome h1 {
                font-size: 30px;
            }

            .icon-btn,
            .voice-btn,
            .send-btn {
                width: 40px;
                height: 40px;
            }

            textarea {
                font-size: 14px;
            }
        }

        @media (max-width: 470px) {
            .auth-box {
                padding: 22px;
            }

            .logo {
                font-size: 30px;
            }

            .bubble {
                font-size: 14px;
            }
        }
    </style>
</head>

<body>

{% if not logged_in %}

<!-- =========================================================
     LOGIN / CREATE ACCOUNT
========================================================== -->

<div class="auth-screen">

    <div class="auth-box">

        <div class="logo">🤖 My AI</div>

        <div class="subtitle">
            Your PCMB study assistant
        </div>

        <div class="tabs">

            <button
                class="tab active"
                id="loginTab"
                type="button"
                onclick="showAuth('login')"
            >
                Login
            </button>

            <button
                class="tab"
                id="registerTab"
                type="button"
                onclick="showAuth('register')"
            >
                Create Account
            </button>

        </div>

        <!-- LOGIN -->

        <div
            class="auth-form active"
            id="loginForm"
        >

            <div class="field">

                <label>
                    Username, Email or Phone
                </label>

                <input
                    type="text"
                    id="loginValue"
                    placeholder="Enter username, email or phone"
                    autocomplete="username"
                >

            </div>

            <div class="field">

                <label>
                    Password
                </label>

                <div class="password-wrap">

                    <input
                        type="password"
                        id="loginPassword"
                        placeholder="Enter password"
                        autocomplete="current-password"
                    >

                    <button
                        type="button"
                        class="show-password"
                        onclick="togglePassword('loginPassword')"
                    >
                        👁
                    </button>

                </div>

            </div>

            <button
                type="button"
                class="auth-button"
                onclick="login()"
            >
                Login
            </button>

        </div>

        <!-- CREATE ACCOUNT -->

        <div
            class="auth-form"
            id="registerForm"
        >

            <div class="field">

                <label>
                    Username
                </label>

                <input
                    type="text"
                    id="registerUsername"
                    placeholder="Choose a username"
                    autocomplete="username"
                >

            </div>

            <div class="field">

                <label>
                    Email <span>(or Phone)</span>
                </label>

                <input
                    type="email"
                    id="registerEmail"
                    placeholder="Optional if using phone"
                    autocomplete="email"
                >

            </div>

            <div class="field">

                <label>
                    Phone <span>(or Email)</span>
                </label>

                <input
                    type="tel"
                    id="registerPhone"
                    placeholder="Optional if using email"
                    autocomplete="tel"
                >

            </div>

            <p style="font-size:12px;color:#667085;margin:-2px 0 14px;">
                Enter either an email address or a phone number.
            </p>

            <div class="field">

                <label>
                    Password
                </label>

                <div class="password-wrap">

                    <input
                        type="password"
                        id="registerPassword"
                        placeholder="At least 6 characters"
                        autocomplete="new-password"
                    >

                    <button
                        type="button"
                        class="show-password"
                        onclick="togglePassword('registerPassword')"
                    >
                        👁
                    </button>

                </div>

            </div>

            <button
                type="button"
                class="auth-button"
                onclick="register()"
            >
                Create Account
            </button>

        </div>

        <div
            class="auth-message"
            id="authMessage"
        ></div>

    </div>

</div>

{% else %}

<!-- =========================================================
     MAIN APP
========================================================== -->

<div class="app">

    <aside class="sidebar">

        <div class="brand">
            🤖 My AI
        </div>

        <button
            type="button"
            class="new-chat"
            onclick="newChat()"
        >
            ＋ New Chat
        </button>

        <div class="sidebar-bottom">

            Logged in as:
            <strong>{{ username }}</strong>

            <button
                type="button"
                class="logout"
                onclick="location.href='/logout'"
            >
                Logout
            </button>

        </div>

    </aside>

    <main class="main">

        <header class="topbar">
            <div class="top-title">My AI</div>
        </header>

        <section
            class="chat"
            id="chat"
        >

            <div
                class="chat-inner"
                id="chatInner"
            >

                <div
                    class="welcome"
                    id="welcome"
                >

                    <h1>🤖 My AI</h1>

                    <p>
                        Hello {{ username }}! 👋
                    </p>

                    <p>
                        Ask Mathematics, Physics,
                        Chemistry, Biology or general questions.
                    </p>

                </div>

            </div>

        </section>

        <!-- COMPOSER -->

        <div class="composer">

            <div class="composer-box">

                <div
                    class="image-preview-wrap"
                    id="imagePreviewWrap"
                >

                    <img
                        id="imagePreview"
                        class="image-preview"
                        alt="Selected image"
                    >

                    <button
                        type="button"
                        class="remove-image"
                        onclick="removeImage()"
                    >
                        Remove image
                    </button>

                </div>

                <div class="input-row">

                    <!-- CUSTOM MIC -->
                    <button
                        type="button"
                        class="voice-btn"
                        onclick="startDictation()"
                        title="Voice input"
                        aria-label="Voice input"
                    >
                        <span class="mic-body"></span>
                    </button>

                    <!-- CAMERA -->
                    <button
                        type="button"
                        class="icon-btn"
                        onclick="openCamera()"
                        title="Camera"
                        aria-label="Camera"
                    >
                        📷
                    </button>

                    <input
                        type="file"
                        id="cameraInput"
                        accept="image/*"
                        capture="environment"
                        hidden
                        onchange="selectImage(event)"
                    >

                    <!-- TEXT -->
                    <textarea
                        id="messageInput"
                        placeholder="Ask My AI anything..."
                        rows="1"
                        oninput="autoResize(this)"
                        onkeydown="handleKey(event)"
                    ></textarea>

                    <!-- SEND -->
                    <button
                        type="button"
                        class="send-btn"
                        id="sendButton"
                        onclick="sendMessage()"
                        title="Send"
                    >
                        ➤
                    </button>

                </div>

            </div>

        </div>

    </main>

</div>

{% endif %}


<script>

/* ============================================================
   AUTH
============================================================ */

function showAuth(type) {

    const loginForm =
        document.getElementById("loginForm");

    const registerForm =
        document.getElementById("registerForm");

    const loginTab =
        document.getElementById("loginTab");

    const registerTab =
        document.getElementById("registerTab");

    const authMessage =
        document.getElementById("authMessage");

    if (type === "login") {

        loginForm.classList.add("active");
        registerForm.classList.remove("active");

        loginTab.classList.add("active");
        registerTab.classList.remove("active");

    } else {

        loginForm.classList.remove("active");
        registerForm.classList.add("active");

        loginTab.classList.remove("active");
        registerTab.classList.add("active");
    }

    if (authMessage) {
        authMessage.textContent = "";
    }
}


function togglePassword(id) {

    const input =
        document.getElementById(id);

    if (!input) {
        return;
    }

    input.type =
        input.type === "password"
            ? "text"
            : "password";
}


/* ============================================================
   REGISTER
============================================================ */

async function register() {

    const username =
        document
            .getElementById("registerUsername")
            .value
            .trim();

    const email =
        document
            .getElementById("registerEmail")
            .value
            .trim();

    const phone =
        document
            .getElementById("registerPhone")
            .value
            .trim();

    const password =
        document
            .getElementById("registerPassword")
            .value;

    const message =
        document.getElementById("authMessage");

    if (!username) {
        message.textContent =
            "Please enter a username.";
        return;
    }

    if (!email && !phone) {
        message.textContent =
            "Enter either email or phone number.";
        return;
    }

    if (password.length < 6) {
        message.textContent =
            "Password must be at least 6 characters.";
        return;
    }

    try {

        const response =
            await fetch(
                "/register",
                {
                    method: "POST",
                    headers: {
                        "Content-Type":
                            "application/json"
                    },
                    body: JSON.stringify({
                        username,
                        email,
                        phone,
                        password
                    })
                }
            );

        const data =
            await response.json();

        if (data.success) {
            window.location.reload();
        } else {
            message.textContent =
                data.message ||
                "Could not create account.";
        }

    } catch (error) {

        console.error(error);

        message.textContent =
            "Could not connect to server.";
    }
}


/* ============================================================
   LOGIN
============================================================ */

async function login() {

    const loginValue =
        document
            .getElementById("loginValue")
            .value
            .trim();

    const password =
        document
            .getElementById("loginPassword")
            .value;

    const message =
        document.getElementById("authMessage");

    if (!loginValue || !password) {

        message.textContent =
            "Enter your login details.";

        return;
    }

    try {

        const response =
            await fetch(
                "/login",
                {
                    method: "POST",
                    headers: {
                        "Content-Type":
                            "application/json"
                    },
                    body: JSON.stringify({
                        login: loginValue,
                        password
                    })
                }
            );

        const data =
            await response.json();

        if (data.success) {
            window.location.reload();
        } else {
            message.textContent =
                data.message ||
                "Login failed.";
        }

    } catch (error) {

        console.error(error);

        message.textContent =
            "Could not connect to server.";
    }
}


/* ============================================================
   CHAT STATE
============================================================ */

let busy = false;
let selectedImage = null;


/* ============================================================
   ESCAPE HTML
============================================================ */

function escapeHtml(text) {

    return text
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;");
}


/* ============================================================
   REMOVE ALL UNWANTED LATEX SIGNS
============================================================ */

function cleanMathFormatting(text) {

    let clean = String(text);


    /* -------------------------
       Remove math delimiters
    ------------------------- */

    clean = clean.replace(/\\\[/g, "");
    clean = clean.replace(/\\\]/g, "");

    clean = clean.replace(/\\\(/g, "");
    clean = clean.replace(/\\\)/g, "");

    clean = clean.replace(/\$\$/g, "");
    clean = clean.replace(/\$/g, "");


    /* -------------------------
       Remove environments
    ------------------------- */

    clean = clean.replace(
        /\\begin\{[^}]*\}/g,
        ""
    );

    clean = clean.replace(
        /\\end\{[^}]*\}/g,
        ""
    );

    clean = clean.replace(
        /\\tag\{[^}]*\}/g,
        ""
    );


    /* -------------------------
       Remove / convert commands
    ------------------------- */

    clean = clean.replace(
        /\\text\{([^{}]*)\}/g,
        "$1"
    );

    clean = clean.replace(
        /\\mathrm\{([^{}]*)\}/g,
        "$1"
    );

    clean = clean.replace(
        /\\mathbf\{([^{}]*)\}/g,
        "$1"
    );

    clean = clean.replace(
        /\\mathit\{([^{}]*)\}/g,
        "$1"
    );

    clean = clean.replace(
        /\\operatorname\{([^{}]*)\}/g,
        "$1"
    );

    clean = clean.replace(
        /\\boxed\{([^{}]*)\}/g,
        "$1"
    );


    /* -------------------------
       Fractions
    ------------------------- */

    clean = clean.replace(
        /\\frac\{([^{}]*)\}\{([^{}]*)\}/g,
        "($1/$2)"
    );

    clean = clean.replace(
        /\\dfrac\{([^{}]*)\}\{([^{}]*)\}/g,
        "($1/$2)"
    );

    clean = clean.replace(
        /\\tfrac\{([^{}]*)\}\{([^{}]*)\}/g,
        "($1/$2)"
    );


    /* -------------------------
       Math symbols
    ------------------------- */

    const symbols = {
        "\\times": "×",
        "\\cdot": "·",
        "\\div": "÷",
        "\\pm": "±",
        "\\mp": "∓",
        "\\leq": "≤",
        "\\le": "≤",
        "\\geq": "≥",
        "\\ge": "≥",
        "\\neq": "≠",
        "\\ne": "≠",
        "\\approx": "≈",
        "\\sim": "∼",
        "\\infty": "∞",
        "\\rightarrow": "→",
        "\\to": "→",
        "\\leftarrow": "←",
        "\\Rightarrow": "⇒",
        "\\Leftarrow": "⇐",
        "\\sqrt": "√",
        "\\degree": "°",
        "\\cdots": "…",
        "\\ldots": "…"
    };

    for (const command in symbols) {

        clean = clean.split(command).join(
            symbols[command]
        );
    }


    /* -------------------------
       Spacing commands
    ------------------------- */

    clean = clean.replace(
        /\\[,;:!]/g,
        ""
    );

    clean = clean.replace(
        /\\quad/g,
        " "
    );

    clean = clean.replace(
        /\\qquad/g,
        " "
    );

    clean = clean.replace(
        /\\ /g,
        " "
    );


    /* -------------------------
       Remove remaining simple
       LaTeX backslash commands
    ------------------------- */

    clean = clean.replace(
        /\\([a-zA-Z]+)/g,
        "$1"
    );


    /* -------------------------
       Clean LaTeX braces
    ------------------------- */

    clean = clean.replace(
        /\\left/g,
        ""
    );

    clean = clean.replace(
        /\\right/g,
        ""
    );


    /* -------------------------
       Superscripts
    ------------------------- */

    clean = clean.replace(/\^0\b/g, "⁰");
    clean = clean.replace(/\^1\b/g, "¹");
    clean = clean.replace(/\^2\b/g, "²");
    clean = clean.replace(/\^3\b/g, "³");
    clean = clean.replace(/\^4\b/g, "⁴");
    clean = clean.replace(/\^5\b/g, "⁵");
    clean = clean.replace(/\^6\b/g, "⁶");
    clean = clean.replace(/\^7\b/g, "⁷");
    clean = clean.replace(/\^8\b/g, "⁸");
    clean = clean.replace(/\^9\b/g, "⁹");


    /* -------------------------
       Subscripts
    ------------------------- */

    clean = clean.replace(/_0\b/g, "₀");
    clean = clean.replace(/_1\b/g, "₁");
    clean = clean.replace(/_2\b/g, "₂");
    clean = clean.replace(/_3\b/g, "₃");
    clean = clean.replace(/_4\b/g, "₄");
    clean = clean.replace(/_5\b/g, "₅");
    clean = clean.replace(/_6\b/g, "₆");
    clean = clean.replace(/_7\b/g, "₇");
    clean = clean.replace(/_8\b/g, "₈");
    clean = clean.replace(/_9\b/g, "₉");


    /* -------------------------
       Remove repeated spaces
    ------------------------- */

    clean = clean.replace(
        /[ \t]{2,}/g,
        " "
    );


    /* -------------------------
       Remove empty brackets
    ------------------------- */

    clean = clean.replace(
        /\[\s*\]/g,
        ""
    );

    clean = clean.replace(
        /\{\s*\}/g,
        ""
    );


    return clean.trim();
}


/* ============================================================
   FORMAT AI ANSWER
============================================================ */

function formatAnswer(text) {

    let clean =
        cleanMathFormatting(text);

    let html =
        escapeHtml(clean);


    /* Bold markdown */

    html = html.replace(
        /\*\*(.*?)\*\*/gs,
        "<strong>$1</strong>"
    );


    /* Headings */

    html = html.replace(
        /^### (.*?)$/gm,
        "<h3>$1</h3>"
    );

    html = html.replace(
        /^## (.*?)$/gm,
        "<h2>$1</h2>"
    );

    html = html.replace(
        /^# (.*?)$/gm,
        "<h2>$1</h2>"
    );


    /* Bullets */

    html = html.replace(
        /^- (.*?)$/gm,
        "• $1"
    );


    /* New lines */

    html = html.replace(
        /\n/g,
        "<br>"
    );


    return html;
}


/* ============================================================
   ADD MESSAGE
============================================================ */

function addMessage(
    role,
    text
) {

    const message =
        document.createElement("div");

    message.className =
        "message " + role;


    const avatar =
        document.createElement("div");

    avatar.className =
        "avatar";

    avatar.textContent =
        role === "user"
            ? "U"
            : "🤖";


    const bubble =
        document.createElement("div");

    bubble.className =
        "bubble";


    bubble.innerHTML =
        formatAnswer(text);


    message.appendChild(avatar);
    message.appendChild(bubble);


    document
        .getElementById("chatInner")
        .appendChild(message);


    scrollBottom();


    return {
        message,
        bubble
    };
}


/* ============================================================
   CAMERA
============================================================ */

function openCamera() {

    const input =
        document.getElementById(
            "cameraInput"
        );

    if (input) {
        input.click();
    }
}


function selectImage(event) {

    const file =
        event.target.files[0];

    if (!file) {
        return;
    }

    if (!file.type.startsWith("image/")) {

        alert(
            "Please select an image."
        );

        return;
    }

    selectedImage = file;


    const preview =
        document.getElementById(
            "imagePreview"
        );

    const wrap =
        document.getElementById(
            "imagePreviewWrap"
        );


    preview.src =
        URL.createObjectURL(file);

    wrap.style.display =
        "block";
}


function removeImage() {

    selectedImage = null;


    const input =
        document.getElementById(
            "cameraInput"
        );

    const wrap =
        document.getElementById(
            "imagePreviewWrap"
        );


    if (input) {
        input.value = "";
    }


    if (wrap) {
        wrap.style.display =
            "none";
    }
}


/* ============================================================
   IMAGE COMPRESSION
============================================================ */

function compressImage(file) {

    return new Promise(
        (resolve, reject) => {

            const img =
                new Image();

            const reader =
                new FileReader();


            reader.onload = () => {

                img.onload = () => {

                    const maxSize = 1400;

                    let width =
                        img.width;

                    let height =
                        img.height;


                    if (width > maxSize) {

                        height =
                            Math.round(
                                height *
                                maxSize /
                                width
                            );

                        width =
                            maxSize;
                    }


                    if (height > maxSize) {

                        width =
                            Math.round(
                                width *
                                maxSize /
                                height
                            );

                        height =
                            maxSize;
                    }


                    const canvas =
                        document.createElement(
                            "canvas"
                        );


                    canvas.width =
                        width;

                    canvas.height =
                        height;


                    const ctx =
                        canvas.getContext(
                            "2d"
                        );


                    ctx.drawImage(
                        img,
                        0,
                        0,
                        width,
                        height
                    );


                    resolve(
                        canvas.toDataURL(
                            "image/jpeg",
                            0.8
                        )
                    );
                };


                img.onerror =
                    reject;

                img.src =
                    reader.result;
            };


            reader.onerror =
                reject;

            reader.readAsDataURL(file);
        }
    );
}


/* ============================================================
   SEND
============================================================ */

async function sendMessage() {

    if (busy) {
        return;
    }


    const input =
        document.getElementById(
            "messageInput"
        );

    const sendButton =
        document.getElementById(
            "sendButton"
        );


    const text =
        input.value.trim();


    if (!text && !selectedImage) {
        return;
    }


    busy = true;


    if (sendButton) {
        sendButton.disabled = true;
    }


    const welcome =
        document.getElementById(
            "welcome"
        );


    if (welcome) {
        welcome.remove();
    }


    if (text) {

        addMessage(
            "user",
            text
        );

    } else {

        addMessage(
            "user",
            "📷 Image question"
        );
    }


    const answer =
        addMessage(
            "assistant",
            ""
        );


    answer.bubble.innerHTML = `
        <div class="loading">
            <span></span>
            <span></span>
            <span></span>
        </div>
    `;


    try {

        let imageData = "";


        if (selectedImage) {

            imageData =
                await compressImage(
                    selectedImage
                );
        }


        const response =
            await fetch(
                "/chat",
                {
                    method: "POST",

                    headers: {
                        "Content-Type":
                            "application/json"
                    },

                    body: JSON.stringify({
                        message: text,
                        image: imageData
                    })
                }
            );


        if (!response.ok) {

            if (response.status === 401) {

                window.location.reload();

                return;
            }

            throw new Error(
                "Request failed"
            );
        }


        const reader =
            response.body.getReader();

        const decoder =
            new TextDecoder();


        let result = "";


        answer.bubble.textContent =
            "";


        while (true) {

            const {
                value,
                done
            } = await reader.read();


            if (done) {
                break;
            }


            result +=
                decoder.decode(
                    value,
                    {
                        stream: true
                    }
                );


            answer.bubble.innerHTML =
                formatAnswer(result);


            scrollBottom();
        }


        if (!result.trim()) {

            result =
                "I couldn't generate an answer.";

            answer.bubble.innerHTML =
                formatAnswer(result);
        }


        addActions(
            answer.message,
            result
        );


    } catch (error) {

        console.error(
            "Chat error:",
            error
        );


        answer.bubble.innerHTML =
            "<strong>❌ Something went wrong.</strong><br><br>" +
            "Please try again.";
    }


    input.value = "";

    autoResize(input);

    removeImage();


    busy = false;


    if (sendButton) {
        sendButton.disabled = false;
    }


    input.focus();

    scrollBottom();
}


/* ============================================================
   ACTION BUTTONS
============================================================ */

function addActions(
    message,
    answer
) {

    const actions =
        document.createElement(
            "div"
        );

    actions.className =
        "actions";


    const items = [
        ["🔄 Improve Answer", "improve"],
        ["🔎 Check Again", "check"],
        ["📚 Explain More", "explain"],
        ["⚡ Make Shorter", "short"],
        ["🔊 Read Answer", "read"]
    ];


    items.forEach(
        ([label, action]) => {

            const button =
                document.createElement(
                    "button"
                );


            button.type = "button";

            button.className =
                "action-btn";

            button.textContent =
                label;


            button.onclick = () => {

                if (action === "read") {

                    readAnswer(answer);

                } else {

                    improveAnswer(
                        action,
                        answer
                    );
                }
            };


            actions.appendChild(
                button
            );
        }
    );


    message
        .querySelector(".bubble")
        .appendChild(actions);
}


/* ============================================================
   IMPROVE
============================================================ */

function findLastQuestion() {

    const messages =
        document.querySelectorAll(
            ".message.user"
        );


    if (!messages.length) {
        return "";
    }


    return messages[
        messages.length - 1
    ]
    .querySelector(".bubble")
    .innerText
    .trim();
}


async function improveAnswer(
    action,
    oldAnswer
) {

    if (busy) {
        return;
    }


    const question =
        findLastQuestion();


    if (!question) {
        return;
    }


    busy = true;


    const answer =
        addMessage(
            "assistant",
            "Working..."
        );


    try {

        const response =
            await fetch(
                "/improve",
                {
                    method: "POST",

                    headers: {
                        "Content-Type":
                            "application/json"
                    },

                    body: JSON.stringify({
                        question,
                        answer: oldAnswer,
                        action
                    })
                }
            );


        if (!response.ok) {

            throw new Error(
                "Improve request failed"
            );
        }


        const reader =
            response.body.getReader();

        const decoder =
            new TextDecoder();


        let result = "";


        answer.bubble.textContent =
            "";


        while (true) {

            const {
                value,
                done
            } = await reader.read();


            if (done) {
                break;
            }


            result +=
                decoder.decode(
                    value,
                    {
                        stream: true
                    }
                );


            answer.bubble.innerHTML =
                formatAnswer(result);


            scrollBottom();
        }


    } catch (error) {

        console.error(
            error
        );

        answer.bubble.innerHTML =
            "<strong>❌ Could not improve answer.</strong>";
    }


    busy = false;
}


/* ============================================================
   MICROPHONE
============================================================ */

function startDictation() {

    const SpeechRecognition =
        window.SpeechRecognition ||
        window.webkitSpeechRecognition;


    if (!SpeechRecognition) {

        alert(
            "Voice input is not supported in this browser."
        );

        return;
    }


    const recognition =
        new SpeechRecognition();


    recognition.lang =
        "en-IN";

    recognition.continuous =
        false;

    recognition.interimResults =
        true;


    const input =
        document.getElementById(
            "messageInput"
        );


    input.placeholder =
        "Listening...";


    recognition.onresult =
        function(event) {

            let text = "";


            for (
                let i = event.resultIndex;
                i < event.results.length;
                i++
            ) {

                text +=
                    event.results[i][0]
                        .transcript;
            }


            input.value =
                text;


            autoResize(
                input
            );
        };


    recognition.onerror =
        function() {

            input.placeholder =
                "Ask My AI anything...";
        };


    recognition.onend =
        function() {

            input.placeholder =
                "Ask My AI anything...";
        };


    recognition.start();
}


/* ============================================================
   READ ANSWER
============================================================ */

function readAnswer(text) {

    if (
        !("speechSynthesis" in window)
    ) {

        alert(
            "Text-to-speech is not supported."
        );

        return;
    }


    window.speechSynthesis.cancel();


    const cleanText =
        cleanMathFormatting(text)
            .replace(
                /[*#]/g,
                ""
            )
            .replace(
                /\n+/g,
                ". "
            );


    const speech =
        new SpeechSynthesisUtterance(
            cleanText
        );


    speech.rate =
        0.95;

    speech.pitch =
        1;


    window.speechSynthesis.speak(
        speech
    );
}


/* ============================================================
   KEYBOARD
============================================================ */

function handleKey(event) {

    if (
        event.key === "Enter" &&
        !event.shiftKey
    ) {

        event.preventDefault();

        sendMessage();
    }
}


/* ============================================================
   TEXTAREA
============================================================ */

function autoResize(textarea) {

    if (!textarea) {
        return;
    }


    textarea.style.height =
        "auto";


    textarea.style.height =
        Math.min(
            textarea.scrollHeight,
            150
        ) + "px";
}


/* ============================================================
   NEW CHAT
============================================================ */

function newChat() {

    document.getElementById(
        "chatInner"
    ).innerHTML = `
        <div
            class="welcome"
            id="welcome"
        >
            <h1>🤖 My AI</h1>

            <p>
                Ask Mathematics, Physics,
                Chemistry, Biology or general questions.
            </p>
        </div>
    `;


    const input =
        document.getElementById(
            "messageInput"
        );


    if (input) {

        input.value =
            "";

        autoResize(input);

        input.focus();
    }


    removeImage();
}


/* ============================================================
   SCROLL
============================================================ */

function scrollBottom() {

    const chat =
        document.getElementById(
            "chat"
        );


    if (!chat) {
        return;
    }


    setTimeout(
        function() {
            chat.scrollTop =
                chat.scrollHeight;
        },
        20
    );
}


/* ============================================================
   STARTUP
============================================================ */

document.addEventListener(
    "DOMContentLoaded",
    function() {

        const input =
            document.getElementById(
                "messageInput"
            );


        if (input) {
            input.focus();
        }
    }
);
