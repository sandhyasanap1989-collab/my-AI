<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>My AI</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f3f6fb;
            color: #182033;
        }

        button,
        input,
        textarea {
            font-family: inherit;
        }

        /* =====================================================
           AUTH
        ===================================================== */

        .auth-screen {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .auth-box {
            width: 100%;
            max-width: 430px;
            background: white;
            padding: 30px;
            border-radius: 20px;
            box-shadow:
                0 15px 45px rgba(15, 23, 42, 0.12);
        }

        .logo {
            text-align: center;
            font-size: 34px;
            font-weight: 800;
            color: #2563eb;
            margin-bottom: 8px;
        }

        .subtitle {
            text-align: center;
            color: #667085;
            margin-bottom: 25px;
        }

        .tabs {
            display: flex;
            gap: 8px;
            margin-bottom: 20px;
        }

        .tab {
            flex: 1;
            padding: 11px;
            border: none;
            border-radius: 10px;
            background: #eef2f7;
            cursor: pointer;
            font-weight: 700;
        }

        .tab.active {
            background: #2563eb;
            color: white;
        }

        .auth-form {
            display: none;
        }

        .auth-form.active {
            display: block;
        }

        .field {
            margin-bottom: 13px;
        }

        .field label {
            display: block;
            margin-bottom: 6px;
            font-size: 13px;
            font-weight: 700;
        }

        .field input {
            width: 100%;
            padding: 12px 13px;
            border: 1px solid #d4dbe7;
            border-radius: 10px;
            outline: none;
            font-size: 14px;
        }

        .field input:focus {
            border-color: #2563eb;
        }

        .password-wrap {
            position: relative;
        }

        .password-wrap input {
            padding-right: 45px;
        }

        .show-password {
            position: absolute;
            right: 10px;
            top: 50%;
            transform: translateY(-50%);
            border: none;
            background: transparent;
            cursor: pointer;
        }

        .auth-button {
            width: 100%;
            border: none;
            background: #2563eb;
            color: white;
            padding: 13px;
            border-radius: 10px;
            font-weight: 800;
            cursor: pointer;
            margin-top: 5px;
        }

        .auth-button:hover {
            background: #1d4ed8;
        }

        .auth-message {
            margin-top: 12px;
            min-height: 20px;
            font-size: 13px;
            color: #dc2626;
            text-align: center;
        }

        /* =====================================================
           APP
        ===================================================== */

        .app {
            min-height: 100vh;
            display: flex;
        }

        .sidebar {
            width: 250px;
            background: white;
            border-right: 1px solid #dfe5ef;
            padding: 18px;
            display: flex;
            flex-direction: column;
        }

        .brand {
            color: #2563eb;
            font-size: 23px;
            font-weight: 800;
            margin-bottom: 20px;
        }

        .new-chat {
            border: none;
            background: #2563eb;
            color: white;
            padding: 12px;
            border-radius: 10px;
            font-weight: 700;
            cursor: pointer;
            margin-bottom: 18px;
        }

        .sidebar-user {
            border-top: 1px solid #e5e7eb;
            margin-top: auto;
            padding-top: 14px;
            font-size: 13px;
        }

        .logout {
            width: 100%;
            border: 1px solid #d7dee9;
            background: white;
            padding: 9px;
            border-radius: 9px;
            cursor: pointer;
            margin-top: 10px;
        }

        .main {
            flex: 1;
            min-width: 0;
            display: flex;
            flex-direction: column;
        }

        .topbar {
            height: 60px;
            background: white;
            border-bottom: 1px solid #dfe5ef;
            display: flex;
            align-items: center;
            padding: 0 18px;
        }

        .top-title {
            font-size: 18px;
            font-weight: 800;
        }

        .chat {
            flex: 1;
            overflow-y: auto;
            padding: 25px 15px 140px;
        }

        .chat-inner {
            max-width: 900px;
            margin: auto;
        }

        .welcome {
            text-align: center;
            margin-top: 100px;
        }

        .welcome h1 {
            font-size: 38px;
            margin-bottom: 10px;
        }

        .welcome p {
            color: #667085;
        }

        .message {
            display: flex;
            gap: 10px;
            margin-bottom: 22px;
        }

        .message.user {
            justify-content: flex-end;
        }

        .avatar {
            width: 36px;
            height: 36px;
            flex-shrink: 0;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 700;
        }

        .assistant .avatar {
            background: #2563eb;
            color: white;
        }

        .user .avatar {
            background: #e5e7eb;
            order: 2;
        }

        .bubble {
            max-width: 85%;
            padding: 14px;
            line-height: 1.65;
            border-radius: 15px;
            white-space: pre-wrap;
            word-break: break-word;
        }

        .assistant .bubble {
            background: white;
            border: 1px solid #e2e8f0;
        }

        .user .bubble {
            background: #2563eb;
            color: white;
        }

        /* =====================================================
           INPUT
        ===================================================== */

        .composer {
            position: fixed;
            bottom: 0;
            left: 250px;
            right: 0;
            padding: 15px;
            background: linear-gradient(
                transparent,
                #f3f6fb 30%
            );
        }

        .composer-box {
            max-width: 900px;
            margin: auto;
            background: white;
            border: 1px solid #d7dee9;
            border-radius: 15px;
            padding: 8px;
            display: flex;
            gap: 8px;
        }

        textarea {
            flex: 1;
            border: none;
            outline: none;
            resize: none;
            min-height: 44px;
            max-height: 140px;
            padding: 11px;
            font-size: 15px;
        }

        .send {
            width: 45px;
            height: 45px;
            border: none;
            border-radius: 11px;
            background: #2563eb;
            color: white;
            cursor: pointer;
            font-size: 18px;
        }

        .actions {
            display: flex;
            flex-wrap: wrap;
            gap: 7px;
            margin-top: 9px;
        }

        .action-button {
            padding: 6px 9px;
            border: 1px solid #d7dee9;
            background: white;
            border-radius: 8px;
            cursor: pointer;
            font-size: 12px;
        }

        @media (max-width: 760px) {
            .sidebar {
                display: none;
            }

            .composer {
                left: 0;
            }

            .bubble {
                max-width: 92%;
            }

            .welcome h1 {
                font-size: 30px;
            }
        }
    </style>
</head>

<body>

{% if not logged_in %}

<div class="auth-screen">

    <div class="auth-box">

        <div class="logo">
            🤖 My AI
        </div>

        <div class="subtitle">
            Your PCMB study assistant
        </div>

        <div class="tabs">

            <button
                class="tab active"
                onclick="showAuth('login')"
                id="loginTab"
            >
                Login
            </button>

            <button
                class="tab"
                onclick="showAuth('register')"
                id="registerTab"
            >
                Create Account
            </button>

        </div>

        <!-- LOGIN -->

        <div
            class="auth-form active"
            id="loginForm"
        >

            <div class="field">
                <label>
                    Username, Email or Phone
                </label>

                <input
                    type="text"
                    id="loginValue"
                    placeholder="Enter username, email or phone"
                >
            </div>

            <div class="field">

                <label>
                    Password
                </label>

                <div class="password-wrap">

                    <input
                        type="password"
                        id="loginPassword"
                        placeholder="Enter password"
                    >

                    <button
                        class="show-password"
                        onclick="togglePassword('loginPassword')"
                    >
                        👁
                    </button>

                </div>

            </div>

            <button
                class="auth-button"
                onclick="login()"
            >
                Login
            </button>

        </div>

        <!-- REGISTER -->

        <div
            class="auth-form"
            id="registerForm"
        >

            <div class="field">
                <label>
                    Username
                </label>

                <input
                    type="text"
                    id="registerUsername"
                    placeholder="Choose username"
                >
            </div>

            <div class="field">
                <label>
                    Email
                </label>

                <input
                    type="email"
                    id="registerEmail"
                    placeholder="your@email.com"
                >
            </div>

            <div class="field">
                <label>
                    Phone Number
                </label>

                <input
                    type="tel"
                    id="registerPhone"
                    placeholder="Optional"
                >
            </div>

            <div class="field">

                <label>
                    Password
                </label>

                <div class="password-wrap">

                    <input
                        type="password"
                        id="registerPassword"
                        placeholder="At least 6 characters"
                    >

                    <button
                        class="show-password"
                        onclick="togglePassword('registerPassword')"
                    >
                        👁
                    </button>

                </div>

            </div>

            <button
                class="auth-button"
                onclick="register()"
            >
                Create Account
            </button>

        </div>

        <div
            class="auth-message"
            id="authMessage"
        ></div>

    </div>

</div>

{% else %}

<div class="app">

    <aside class="sidebar">

        <div class="brand">
            🤖 My AI
        </div>

        <button
            class="new-chat"
            onclick="newChat()"
        >
            ＋ New Chat
        </button>

        <div class="sidebar-user">

            Logged in as:

            <strong>
                {{ username }}
            </strong>

            <button
                class="logout"
                onclick="location.href='/logout'"
            >
                Logout
            </button>

        </div>

    </aside>

    <main class="main">

        <header class="topbar">

            <div class="top-title">
                My AI
            </div>

        </header>

        <section
            class="chat"
            id="chat"
        >

            <div
                class="chat-inner"
                id="chatInner"
            >

                <div
                    class="welcome"
                    id="welcome"
                >

                    <h1>
                        🤖 My AI
                    </h1>

                    <p>
                        Hello {{ username }}! 👋
                        Ask me Mathematics, Physics,
                        Chemistry, Biology or general questions.
                    </p>

                </div>

            </div>

        </section>

        <div class="composer">

            <div class="composer-box">

                <textarea
                    id="messageInput"
                    placeholder="Ask My AI anything..."
                    onkeydown="handleKey(event)"
                ></textarea>

                <button
                    class="send"
                    onclick="sendMessage()"
                >
                    ➤
                </button>

            </div>

        </div>

    </main>

</div>

{% endif %}


<script>

    // ========================================================
    // AUTH TABS
    // ========================================================

    function showAuth(type) {

        const loginForm =
            document.getElementById(
                "loginForm"
            );

        const registerForm =
            document.getElementById(
                "registerForm"
            );

        const loginTab =
            document.getElementById(
                "loginTab"
            );

        const registerTab =
            document.getElementById(
                "registerTab"
            );

        if (type === "login") {

            loginForm.classList.add(
                "active"
            );

            registerForm.classList.remove(
                "active"
            );

            loginTab.classList.add(
                "active"
            );

            registerTab.classList.remove(
                "active"
            );

        } else {

            loginForm.classList.remove(
                "active"
            );

            registerForm.classList.add(
                "active"
            );

            loginTab.classList.remove(
                "active"
            );

            registerTab.classList.add(
                "active"
            );
        }

        document.getElementById(
            "authMessage"
        ).textContent = "";
    }


    // ========================================================
    // PASSWORD
    // ========================================================

    function togglePassword(id) {

        const input =
            document.getElementById(id);

        input.type =
            input.type === "password"
                ? "text"
                : "password";
    }


    // ========================================================
    // REGISTER
    // ========================================================

    async function register() {

        const username =
            document.getElementById(
                "registerUsername"
            ).value.trim();

        const email =
            document.getElementById(
                "registerEmail"
            ).value.trim();

        const phone =
            document.getElementById(
                "registerPhone"
            ).value.trim();

        const password =
            document.getElementById(
                "registerPassword"
            ).value;

        const message =
            document.getElementById(
                "authMessage"
            );

        try {

            const response =
                await fetch(
                    "/register",
                    {
                        method: "POST",
                        headers: {
                            "Content-Type":
                                "application/json"
                        },
                        body: JSON.stringify({
                            username,
                            email,
                            phone,
                            password
                        })
                    }
                );

            const data =
                await response.json();

            if (data.success) {
                location.reload();
            } else {
                message.textContent =
                    data.message;
            }

        } catch (error) {

            message.textContent =
                "Could not connect to server.";

            console.error(error);
        }
    }


    // ========================================================
    // LOGIN
    // ========================================================

    async function login() {

        const loginValue =
            document.getElementById(
                "loginValue"
            ).value.trim();

        const password =
            document.getElementById(
                "loginPassword"
            ).value;

        const message =
            document.getElementById(
                "authMessage"
            );

        try {

            const response =
                await fetch(
                    "/login",
                    {
                        method: "POST",
                        headers: {
                            "Content-Type":
                                "application/json"
                        },
                        body: JSON.stringify({
                            login: loginValue,
                            password
                        })
                    }
                );

            const data =
                await response.json();

            if (data.success) {
                location.reload();
            } else {
                message.textContent =
                    data.message;
            }

        } catch (error) {

            message.textContent =
                "Could not connect to server.";

            console.error(error);
        }
    }


    // ========================================================
    // CHAT
    // ========================================================

    let busy = false;

    function escapeHtml(text) {

        return text
            .replace(/&/g, "&amp;")
            .replace(/</g, "&lt;")
            .replace(/>/g, "&gt;");
    }


    function formatAnswer(text) {

        let html =
            escapeHtml(text);

        html = html.replace(
            /\*\*(.*?)\*\*/gs,
            "<strong>$1</strong>"
        );

        html = html.replace(
            /^### (.*?)$/gm,
            "<h3>$1</h3>"
        );

        html = html.replace(
            /^## (.*?)$/gm,
            "<h2>$1</h2>"
        );

        html = html.replace(
            /\n/g,
            "<br>"
        );

        return html;
    }


    function addMessage(
        role,
        text
    ) {

        const message =
            document.createElement(
                "div"
            );

        message.className =
            "message " + role;

        const avatar =
            document.createElement(
                "div"
            );

        avatar.className =
            "avatar";

        avatar.textContent =
            role === "user"
                ? "U"
                : "🤖";

        const bubble =
            document.createElement(
                "div"
            );

        bubble.className =
            "bubble";

        bubble.innerHTML =
            formatAnswer(text);

        message.appendChild(
            avatar
        );

        message.appendChild(
            bubble
        );

        document.getElementById(
            "chatInner"
        ).appendChild(message);

        scrollBottom();

        return {
            message,
            bubble
        };
    }


    async function sendMessage() {

        if (busy) return;

        const input =
            document.getElementById(
                "messageInput"
            );

        const text =
            input.value.trim();

        if (!text) return;

        busy = true;

        const welcome =
            document.getElementById(
                "welcome"
            );

        if (welcome) {
            welcome.remove();
        }

        addMessage(
            "user",
            text
        );

        input.value = "";

        const answer =
            addMessage(
                "assistant",
                "Thinking..."
            );

        try {

            const response =
                await fetch(
                    "/chat",
                    {
                        method: "POST",
                        headers: {
                            "Content-Type":
                                "application/json"
                        },
                        body: JSON.stringify({
                            message: text
                        })
                    }
                );

            if (!response.ok) {
                throw new Error(
                    "Request failed"
                );
            }

            const reader =
                response.body.getReader();

            const decoder =
                new TextDecoder();

            let result = "";

            answer.bubble.textContent =
                "";

            while (true) {

                const {
                    value,
                    done
                } = await reader.read();

                if (done) break;

                result +=
                    decoder.decode(
                        value,
                        {
                            stream: true
                        }
                    );

                answer.bubble.innerHTML =
                    formatAnswer(result);

                scrollBottom();
            }

            addActions(
                answer.message,
                result
            );

        } catch (error) {

            answer.bubble.innerHTML =
                "<strong>❌ Something went wrong.</strong>";

            console.error(error);
        }

        busy = false;
        input.focus();
    }


    // ========================================================
    // ACTIONS
    // ========================================================

    function addActions(
        message,
        answer
    ) {

        const actions =
            document.createElement(
                "div"
            );

        actions.className =
            "actions";

        const items = [
            ["🔄 Improve Answer", "improve"],
            ["🔎 Check Again", "check"],
            ["📚 Explain More", "explain"],
            ["⚡ Make Shorter", "short"]
        ];

        items.forEach(
            ([name, action]) => {

                const button =
                    document.createElement(
                        "button"
                    );

                button.className =
                    "action-button";

                button.textContent =
                    name;

                button.onclick = () => {

                    const question =
                        findLastQuestion();

                    if (!question) return;

                    improve(
                        question,
                        answer,
                        action
                    );
                };

                actions.appendChild(
                    button
                );
            }
        );

        message.querySelector(
            ".bubble"
        ).appendChild(actions);
    }


    function findLastQuestion() {

        const messages =
            document.querySelectorAll(
                ".message.user"
            );

        if (!messages.length) {
            return "";
        }

        return messages[
            messages.length - 1
        ].querySelector(
            ".bubble"
        ).innerText.trim();
    }


    async function improve(
        question,
        answer,
        action
    ) {

        if (busy) return;

        busy = true;

        const newAnswer =
            addMessage(
                "assistant",
                "Working..."
            );

        try {

            const response =
                await fetch(
                    "/improve",
                    {
                        method: "POST",
                        headers: {
                            "Content-Type":
                                "application/json"
                        },
                        body: JSON.stringify({
                            question,
                            answer,
                            action
                        })
                    }
                );

            const reader =
                response.body.getReader();

            const decoder =
                new TextDecoder();

            let result = "";

            newAnswer.bubble.textContent =
                "";

            while (true) {

                const {
                    value,
                    done
                } = await reader.read();

                if (done) break;

                result +=
                    decoder.decode(
                        value,
                        {
                            stream: true
                        }
                    );

                newAnswer.bubble.innerHTML =
                    formatAnswer(result);

                scrollBottom();
            }

        } catch (error) {

            newAnswer.bubble.innerHTML =
                "<strong>❌ Could not improve answer.</strong>";

            console.error(error);
        }

        busy = false;
    }


    // ========================================================
    // NEW CHAT
    // ========================================================

    function newChat() {

        document.getElementById(
            "chatInner"
        ).innerHTML = `
            <div
                class="welcome"
                id="welcome"
            >
                <h1>🤖 My AI</h1>

                <p>
                    Ask me Mathematics, Physics,
                    Chemistry, Biology or general questions.
                </p>
            </div>
        `;
    }


    // ========================================================
    // KEYBOARD
    // ========================================================

    function handleKey(event) {

        if (
            event.key === "Enter"
            && !event.shiftKey
        ) {
            event.preventDefault();
            sendMessage();
        }
    }


    // ========================================================
    // SCROLL
    // ========================================================

    function scrollBottom() {

        const chat =
            document.getElementById(
                "chat"
            );

        chat.scrollTop =
            chat.scrollHeight;
    }

</script>

</body>
</html>
